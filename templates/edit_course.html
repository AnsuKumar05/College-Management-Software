{% extends "base.html" %}

{% block title %}Edit Course - College Management System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0">
                    <i class="fas fa-edit me-2"></i>Edit Course: {{ course.name }}
                </h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="code" class="form-label">Course Code</label>
                                <input type="text" class="form-control" id="code" name="code" 
                                       value="{{ course.code }}" readonly>
                                <div class="form-text">Course code cannot be changed</div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="credits" class="form-label">Credits *</label>
                                <input type="number" class="form-control" id="credits" name="credits" 
                                       value="{{ course.credits }}" required min="1" max="10">
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="name" class="form-label">Course Name *</label>
                        <input type="text" class="form-control" id="name" name="name" 
                               value="{{ course.name }}" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="instructor_id" class="form-label">Instructor</label>
                                <select class="form-select" id="instructor_id" name="instructor_id">
                                    <option value="">Select an instructor</option>
                                    {% for teacher in teachers %}
                                    <option value="{{ teacher.id }}" 
                                            {% if teacher.id == course.instructor_id %}selected{% endif %}>
                                        {{ teacher.name }} ({{ teacher.id }})
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="department" class="form-label">Department *</label>
                                <select class="form-select" id="department" name="department" required>
                                    <option value="">Select a department</option>
                                    {% for department in departments %}
                                    <option value="{{ department.code }}" 
                                            {% if department.code == course.department %}selected{% endif %}>
                                        {{ department.name }}
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('courses') }}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left me-2"></i>Back to Courses
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-2"></i>Update Course
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
